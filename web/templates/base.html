<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}EcoHarmony Park{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
  <header class="encabezado">
    <a class="marca" href="{{ url_for('inicio') }}">
      <img class="logo" src="{{ url_for('static', filename='logo.png') }}"
           alt="">
      EcoHarmony Park
    </a>
    <nav class="menu">
      <a href="{{ url_for('inicio') }}">Inscribirme</a>
      <a href="{{ url_for('cupos') }}">Ver cupos</a>
    </nav>
  </header>
  <main class="contenido">
    {% block contenido %}{% endblock %}
  </main>
  <footer class="pie">Abierto de 8:30 a 19 hs. Cerrado los lunes, el 25/12 y el 1/1.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
